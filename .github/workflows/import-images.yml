name: Import binary images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode image pack and commit binaries
        run: |
          set -euo pipefail
          if [ ! -d tmp-image-packs ]; then
            echo "No image packs present; nothing to do"
            exit 0
          fi
          cat tmp-image-packs/part-* | base64 -d | tar -xf -
          rm -rf tmp-image-packs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add product and brand images"
          git push
